- equation: H + O2 (+M) <=> HO2 (+M)
  type: linear-Burke
  colliders:
  - name: M
    type: pressure-dependent-Arrhenius
    rate-constants:
    - {P: 0.10 atm, A: 9.6149E+17, b: -2.800, Ea: 739.430}
    - {P: 1.00 atm, A: 8.2354E+18, b: -2.780, Ea: 836.070}
    - {P: 10.00 atm, A: 4.9667E+19, b: -2.719, Ea: 989.680}
    - {P: 100.0 atm, A: 1.7637E+20, b: -2.596, Ea: 1256.89}
  -name: O2
    type: pressure-dependent-Arrhenius
    rate-constants:
    - {P: 0.10 atm, A: 3.5715E+18, b: -2.988, Ea: 747.150}
