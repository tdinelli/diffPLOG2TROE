description: |-
  Test mechanism to compare KiRATE's implementation against CANTERA

units: {length: cm, time: s, quantity: mol, activation-energy: cal/mol}

phases:
- name: gas
  thermo: ideal-gas
  elements: [C, H, O, N, He, Ar]
  species:
  - {gri30.yaml/species: [CH4, CH3, CH2O, C2H6]}
  - {example_data/ammonia-CO-H2-Alzueta-2023.yaml/species: [H, O2, HO2, O, OH,
        AR, CO, CO2, H2, H2O, N2, HONO, NO, HE, NH3]}
  kinetics: gas
  state: {T: 300.0, P: 1 atm}

reactions:
# -----------------------------------------
# Modified Arrhenius
# -----------------------------------------
- equation: H + O2 <=> O + OH  # Reaction 1
  rate-constant: {A: 1.0e+14, b: 0.0, Ea: 1.5286e+04}
  note: Hong et al., Proc. Comb. Inst. 33:309-316 (2011)

# -----------------------------------------
# FallOff (TROE)
# -----------------------------------------
- equation: H + O2 (+M) <=> HO2 (+M)  # Reaction 2
  type: falloff
  low-P-rate-constant: {A: 6.366e+20, b: -1.72, Ea: 524.8}
  high-P-rate-constant: {A: 4.7e+12, b: 0.44, Ea: 0.0}
  Troe: {A: 0.5, T3: 1.0e-30, T1: 1.0e+30}
  efficiencies: {H2: 2.0, H2O: 14.0, O2: 0.78, CO: 1.9, CO2: 3.8, AR: 0.67}
  note: |-
    Srinivasan and Michael, Int. J. Chem. Kinetic. 38 (2006)
    MAIN BATH GAS IS N2

# -----------------------------------------
# PLOG
# -----------------------------------------
- equation: OH + NO <=> HONO  # Reaction 3 (PLOG)
  type: pressure-dependent-Arrhenius
  rate-constants:
  - {P: 0.01 atm, A: 5.02e+21, b: -4.24, Ea: 898.9}
  - {P: 0.1 atm, A: 5.31e+22, b: -4.24, Ea: 1184.0}
  - {P: 0.316 atm, A: 1.38e+23, b: -4.22, Ea: 1376.0}
  - {P: 1.0 atm, A: 3.09e+23, b: -4.17, Ea: 1621.0}
  - {P: 3.16 atm, A: 5.45e+23, b: -4.09, Ea: 1911.0}
  - {P: 10.0 atm, A: 6.35e+23, b: -3.97, Ea: 2222.0}
  - {P: 31.6 atm, A: 3.68e+23, b: -3.75, Ea: 2501.0}
  - {P: 100.0 atm, A: 7.29e+22, b: -3.41, Ea: 2660.0}
  note: |-
    Chen, X., Fuller, M. E., & Goldsmith, C. F. Reac Chem Eng, 4(2), 323-333
    (2019).

# -----------------------------------------
# CHEBYSHEV
# -----------------------------------------
- equation: CH4 <=> CH3 + H # Reaction 4 (Chebyshev)
  type: Chebyshev
  temperature-range: [290, 3000]
  pressure-range: [0.0098692326671601278 atm, 98.692326671601279 atm]
  data: [[-1.44280e+01,  2.59970e-01, -2.24320e-02, -2.78700e-03],
         [ 2.20630e+01,  4.88090e-01, -3.96430e-02, -5.48110e-03],
         [-2.32940e-01,  4.01900e-01, -2.60730e-02, -5.04860e-03],
         [-2.93660e-01,  2.85680e-01, -9.33730e-03, -4.01020e-03],
         [-2.26210e-01,  1.69190e-01,  4.85810e-03, -2.38030e-03],
         [-1.43220e-01,  7.71110e-02,  1.27080e-02, -6.41540e-04]]
  note: Taken from CANTERA example

# -----------------------------------------
# CHEMICALLY ACTIVATED
# -----------------------------------------
- equation: CH3 + OH (+M) <=> CH2O + H2 (+M) # Reaction 5 (CABR)
  type: chemically-activated
  high-P-rate-constant: [5.88E-14, 6.721, -3022.227]
  low-P-rate-constant: [282320.078, 1.46878, -3270.56495]

# -----------------------------------------
# Threebody reaction
# -----------------------------------------
- equation: O + H + M <=> OH + M # Reaction 6 (3 body)
  type: three-body
  rate-constant: {A: 5.0e+17, b: -1.0, Ea: 0.0}
  efficiencies: {H2: 2.0, H2O: 6.0, CH4: 2.0, CO: 1.5, CO2: 2.0, C2H6: 3.0,
    AR: 0.7}

# -----------------------------------------
# LMR-R (https://cantera.org/stable/yaml/reactions.html#sec-yaml-linear-burke)
# -----------------------------------------
- equation: H + O2 (+M) <=> HO2 (+M) # Reaction 7 (LMR-R)
  type: linear-Burke
  duplicate: true
  colliders:
  - name: M
    type: pressure-dependent-Arrhenius
    rate-constants:
    - {P: 1.316e-02 atm, A: 9.39968e+14, b: -2.14348e+00, Ea: 7.72730e+01}
    - {P: 1.316e-01 atm, A: 1.07254e+16, b: -2.15999e+00, Ea: 1.30239e+02}
    - {P: 3.947e-01 atm, A: 3.17830e+16, b: -2.15813e+00, Ea: 1.66994e+02}
    - {P: 1.000e+00 atm, A: 7.72584e+16, b: -2.15195e+00, Ea: 2.13473e+02}
    - {P: 3.000e+00 atm, A: 2.11688e+17, b: -2.14062e+00, Ea: 2.79031e+02}
    - {P: 1.000e+01 atm, A: 6.53093e+17, b: -2.13213e+00, Ea: 3.87493e+02}
    - {P: 3.000e+01 atm, A: 1.49784e+18, b: -2.10026e+00, Ea: 4.87579e+02}
    - {P: 1.000e+02 atm, A: 3.82218e+18, b: -2.07057e+00, Ea: 6.65984e+02}
  - name: HE
    efficiency: {A: 3.37601e-01, b: 1.82568e-01, Ea: 3.62408e+01}
  - name: N2
    efficiency: {A: 1.24932e+02, b: -5.93263e-01, Ea: 5.40921e+02}
  - name: H2
    efficiency: {A: 3.13717e+04, b: -1.25419e+00, Ea: 1.12924e+03}
  - name: CO2
    efficiency: {A: 1.62413e+08, b: -2.27622e+00, Ea: 1.97023e+03}
  - name: NH3
    efficiency: {A: 4.97750e+00, b: 1.64855e-01, Ea: -2.80351e+02}
  - name: H2O
    efficiency: {A: 3.69146e+01, b: -7.12902e-02, Ea: 3.19087e+01}

# -----------------------------------------
# LMR-R: From Stagni, A. and Dinelli, T. doi: https://doi.org/10.1016/j.cej.2025.170737
# -----------------------------------------
- equation: H + O2 (+M) <=> HO2 (+M)  # Reaction 8 (LMR-R)
  type: linear-Burke
  duplicate: true
  colliders:
  - name: M
    type: falloff
    high-P-rate-constant: {A: 4.66000000E+12, b: 4.40000000E-01, Ea: 0.00000000}
    low-P-rate-constant: {A: 4.06620000E+19, b: -1.40000000, Ea: -1.80537000E+02}
    Troe: {A: 0.5, T3: 1.0, T1: 1.0E+10, T2: 1.0E+30}
  - name: N2 
    type: falloff
    high-P-rate-constant: {A: 4.66000000E+12, b: 4.40000000E-01, Ea: 0.00000000}
    low-P-rate-constant: {A: 1.91000000E+20, b: -1.55680000, Ea: 2.53860000E+02}
    Troe: {A: 0.5, T3: 1.0, T1: 1.0E+10, T2: 1.0E+30}
    efficiency: {A: 4.6973, b: -0.157, Ea: 434.4}
  - name: H2
    efficiency: {A: 2.0, b: 0, Ea: 0}
  - name: H2O 
    efficiency: {A: 17.6, b: 0, Ea: 0}
  - name: O2 
    efficiency: {A: 1.0, b: 0, Ea: 0}
  - name: NH3
    efficiency: {A: 0.0927, b: 0.6872, Ea: -614.0}
  - name: HE
    type: falloff
    high-P-rate-constant: {A: 4.66000000E+12, b: 4.40000000E-01, Ea: 0.00000000}
    low-P-rate-constant: {A: 1.216E+19, b: -1.23000000, Ea: 0.0}
    Troe: {A: 0.67, T3: 1.0E-30, T1: 1.0E+30, T2: 1.0E+30}
    efficiency: {A: 0.2991, b: 0.170, Ea: 180.5}
  - name: AR
    type: pressure-dependent-Arrhenius
    rate-constants:
    - {P: 1.00000000E-02 atm, A: 8.45360E+14, b: -2.19120, Ea: 1.14078E+01}
    - {P: 1.00000000E-01 atm, A: 8.26120E+15, b: -2.18930, Ea: 2.35054E+01}
    - {P: 1.00000000E+00 atm, A: 8.39046E+16, b: -2.19250, Ea: 6.13437E+01}
    - {P: 5.00000000E+00 atm, A: 4.94439E+17, b: -2.21410, Ea: 1.48419E+02}
    - {P: 1.00000000E+01 atm, A: 1.20063E+18, b: -2.23890, Ea: 2.28993E+02}
    - {P: 2.00000000E+01 atm, A: 3.35001E+18, b: -2.28080, Ea: 3.58971E+02}
    - {P: 3.00000000E+01 atm, A: 9.75402E+19, b: -2.67880, Ea: 6.10486E+02}
    - {P: 4.00000000E+01 atm, A: 1.89318E+20, b: -2.72520, Ea: 7.46275E+02}
    - {P: 5.00000000E+01 atm, A: 3.11736E+20, b: -2.75890, Ea: 8.57089E+02}
    - {P: 1.00000000E+02 atm, A: 1.06227E+21, b: -2.81950, Ea: 1.19199E+03}
    - {P: 3.00000000E+02 atm, A: 1.06233E+21, b: -2.66310, Ea: 1.49349E+03}
    efficiency: {A: 0.1706, b: 0.2090, Ea: 191.9}

# Reaction 5-7: Separate reactions, but calculated on the full mixture concentration.
# These are the rates needed to compute the Chemkin-style mole-fraction based weighting
# See: https://github.com/Cantera/enhancements/issues/193
# H + O2 (+M) = HO2 (+M) 4.650e+012 0.440 0.0
#   LowMX  /            1.737e+019 -1.230 0.0 /
#   TroeMX / 6.700e-001 1.000e-030 1.000e+030 1.000e+030 /
#   LowSP  / AR 6.810e+018 -1.200 0.0 /
#   TroeSP / AR 7.000e-001 1.000e-030 1.000e+030 1.000e+030 /
#   LowSP  / HE 9.192e+018 -1.200 0.0 /
#   TroeSP / HE 5.900e-001 1.000e-030 1.000e+030 1.000e+030 /
#   HE / 1.0 / AR / 1.0 / H2/ 1.30/ H2O/ 10.00 /
# -----------------------------------------
# LMR-P
# -----------------------------------------
# - equation: H + O2 (+M) <=> HO2 (+M) # Reaction 5
#   type: falloff
#   duplicate: true
#   low-P-rate-constant: [1.737e+019, -1.230, 0.0]
#   high-P-rate-constant: [4.650e+012, 0.440, 0.0]
#   Troe: {A: 6.700e-001, T3: 1.000e-030, T1: 1.000e+030, T2: 1.000e+030}
#   efficiencies: {H2: 1.3, H2O: 10.0}
# - equation: H + O2 (+M) <=> HO2 (+M) # Reaction 6 (Ar)
#   type: falloff
#   duplicate: true
#   low-P-rate-constant: [6.810e+018, -1.200, 0.0]
#   high-P-rate-constant: [4.650e+012, 0.440, 0.0]
#   Troe: {A: 7.000e-001, T3: 1.000e-030, T1: 1.000e+030, T2: 1.000e+030}
# - equation: H + O2 (+M) <=> HO2 (+M) # Reaction 7 (He)
#   type: falloff
#   duplicate: true
#   low-P-rate-constant: [9.192e+018, -1.200, 0.0]
#   high-P-rate-constant: [4.650e+012, 0.440, 0.0]
#   Troe: {A: 5.900e-001, T3: 1.000e-030, T1: 1.000e+030, T2: 1.000e+030}
# -----------------------------------------
# LMR-R
# -----------------------------------------
# - equation: H + O2 (+M) <=> HO2 (+M) # Reaction 8 (LMR-R burke cantera style)
#   type: linear-Burke
#   duplicate: true
#   colliders:
#   - name: M
#     type: falloff
#     low-P-rate-constant: [1.737e+019, -1.230, 0.0]
#     high-P-rate-constant: [4.650e+012, 0.440, 0.0]
#     Troe: {A: 6.700e-001, T3: 1.000e-030, T1: 1.000e+030, T2: 1.000e+030}
#   - name: AR
#     type: falloff
#     low-P-rate-constant: [6.810e+018, -1.200, 0.0]
#     high-P-rate-constant: [4.650e+012, 0.440, 0.0]
#     Troe: {A: 7.000e-001, T3: 1.000e-030, T1: 1.000e+030, T2: 1.000e+030}
#     efficiency: {A: 1, b: 0, Ea: 0}
#   - name: He
#     type: falloff
#     low-P-rate-constant: [9.192e+018, -1.200, 0.0]
#     high-P-rate-constant: [4.650e+012, 0.440, 0.0]
#     Troe: {A: 5.900e-001, T3: 1.000e-030, T1: 1.000e+030, T2: 1.000e+030}
#     efficiency: {A: 1, b: 0, Ea: 0}
#   - name: H2
#     efficiency: {A: 1.3, b: 0, Ea: 0}
#   - name: H2O
#     efficiency: {A: 10.0, b: 0, Ea: 0}
# -----------------------------------------
# Stuff needed to perform some sanity
# checks over some of the implementations
# -----------------------------------------
# Here we are testing the equivalence of
# the two implementations (reactions 9 and 10)
# - equation: H + O2 (+M) <=> HO2 (+M) # Reaction 9
#   type: falloff
