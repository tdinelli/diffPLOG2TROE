[project]
name = "diffPLOG2TROE"
dynamic = ["version"]
description = "A differentiable PLOG to TROE refitter"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Timoteo Dinelli", email = "timoteo.dinelli@polimi.it"},
]
dependencies = ["numpy", "matplotlib", "jax", "jaxtyping", "chex", "optax", "equinox"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build]
include = ["diffPLOG2TROE/*"]


[tool.hatch.version]
path="diffPLOG2TROE/_version.py"
