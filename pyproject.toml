[project]
name = "KiRATE"
dynamic = ["version"]
description = "Kinetic Analysis and Rate Tuning Environment"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Timoteo Dinelli", email = "timoteo.dinelli@polimi.it"}]
dependencies = [
    "numpy",
    "matplotlib", 
    "jax",
    "jaxtyping",
    "chex",
    "optax",
    "optimistix",
    "equinox"
]
keywords = ["chemistry", "reaction-kinetics", "differentiable"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12", 
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
test = ["pytest >=6", "pytest-cov >=3"]
dev = [
    "pytest >=6", 
    "pytest-cov >=3",
    "sphinx", 
    "sphinx-rtd-theme", 
    "sphinx-autodoc-typehints",
    "myst-parser",
    "sphinx-copybutton",
    "sphinxcontrib-napoleon"
]
docs = [
    "sphinx", 
    "sphinx-rtd-theme", 
    "sphinx-autodoc-typehints",
    "myst-parser",  # For markdown support
    "sphinx-copybutton",  # For copy buttons on code blocks
    "sphinxcontrib-napoleon"  # For Google/NumPy style docstrings
]
all = [
    "pytest >=6", 
    "pytest-cov >=3",
    "sphinx", 
    "sphinx-rtd-theme", 
    "sphinx-autodoc-typehints",
    "myst-parser",
    "sphinx-copybutton",
    "sphinxcontrib-napoleon"
]

[project.urls]
"Homepage" = "https://github.com/tdinelli/KiRATE"
"Bug Tracker" = "https://github.com/tdinelli/KiRATE/issues"
"Documentation" = "https://tdinelli.github.io/KiRATE"
"Repository" = "https://github.com/tdinelli/KiRATE"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["KiRATE/*"]

[tool.hatch.version]
path = "KiRATE/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["KiRATE"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]
